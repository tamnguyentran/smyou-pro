# SOURCE OF TRUTH for authorization and navigation. Backend loads this file; tests are generated from it:
#   - for every capability × role: allowed roles succeed (within scope), all others get 403
#   - every API route must declare exactly one capability (or be listed under public_routes) — else test fails
#   - every menu item's capability must exist here; menu shown to a user = items whose capability they hold
# A user can hold SEVERAL roles; effective permission = union. Scope precedence: all > own/assigned.
# Editing this file changes business rules → requires product-owner approval (Claude Code will ask).
version: 1

roles:
  MANAGER:       { label: Quản lý chung }
  SALE:          { label: Nhân viên kinh doanh }
  CUSTOMER_CARE: { label: Chăm sóc khách hàng }
  TECH_LEAD:     { label: Quản lý kỹ thuật }
  TECHNICIAN:    { label: Nhân viên kỹ thuật }

# scope meanings:
#   all      — every record
#   own      — records the user created (orders.created_by / customers.created_by)
#   assigned — records linked to a task where the user has (or had) an assignment
#   self     — the user's own record only
scopes: [all, own, assigned, self]

capabilities:
  # --- Danh mục ---
  catalog.read:          { MANAGER: all, SALE: all, CUSTOMER_CARE: all, TECH_LEAD: all }
  catalog.manage:        { MANAGER: all }
  # --- Nhân sự ---
  employee.read:         { MANAGER: all, TECH_LEAD: all }
  employee.manage:       { MANAGER: all }            # create, edit, deactivate, set roles, reset password
  employee.lookup:       { MANAGER: all, SALE: all, CUSTOMER_CARE: all, TECH_LEAD: all }  # M16-11: slim picker search (id/code/name/phone), every order-screen role
  profile.manage:        { MANAGER: self, SALE: self, CUSTOMER_CARE: self, TECH_LEAD: self, TECHNICIAN: self }
  # --- Khách hàng ---
  customer.read:         { MANAGER: all, SALE: all, CUSTOMER_CARE: all, TECH_LEAD: all }
  customer.manage:       { MANAGER: all, SALE: all, CUSTOMER_CARE: all }
  customer_gift.read:    { MANAGER: all, SALE: all, CUSTOMER_CARE: all }    # M16-01a, Q97: all — not own
  customer_gift.manage:  { MANAGER: all, SALE: all, CUSTOMER_CARE: all }    # create + edit, no delete (Q97)
  # --- Đơn hàng ---
  order.read:            { MANAGER: all, SALE: all, CUSTOMER_CARE: all, TECH_LEAD: all, TECHNICIAN: assigned }
  order.read_prices:     { MANAGER: all, SALE: all, TECH_LEAD: all, TECHNICIAN: assigned }  # Q03: technicians see prices of their orders
  order.create:          { MANAGER: all, SALE: all, CUSTOMER_CARE: all }
  order.edit_draft:      { MANAGER: all, SALE: own, CUSTOMER_CARE: own }
  order.edit_contact:    { MANAGER: all, SALE: own }  # phone/address/notes after submit, until COMPLETED
  order.edit_lines_after_submit: { MANAGER: all, SALE: own }  # Q09: until COMPLETED/CANCELLED, audited
  order.submit:          { MANAGER: all, SALE: own }
  order.cancel:          { MANAGER: all, SALE: own }
  order.cancel_active:   { MANAGER: all }
  order.upload_confirmation: { TECH_LEAD: all, TECHNICIAN: assigned }
  order.complete:        { TECH_LEAD: all, TECHNICIAN: assigned }  # Q04
  order.revise:          { TECH_LEAD: all }
  customer_care.manage_feedback: { MANAGER: all, CUSTOMER_CARE: all }  # scaffolded here (M15-01), used from M15-02a
  # --- Đầu việc ---
  task.read:             { MANAGER: all, TECH_LEAD: all, TECHNICIAN: assigned }
  task.manage:           { TECH_LEAD: all }          # create, update, assign, remove assignee, cancel
  task.reopen:           { TECH_LEAD: all }
  assignment.respond:    { TECHNICIAN: self }        # accept/reject/start/complete OWN assignment only
  task.upload_photo:     { TECH_LEAD: all, TECHNICIAN: assigned }
  # --- Báo cáo ---
  dashboard.read:        { MANAGER: all, SALE: own, TECH_LEAD: all, TECHNICIAN: self, CUSTOMER_CARE: all }
  kpi.read:              { MANAGER: all, TECH_LEAD: all, TECHNICIAN: self }
  report.revenue.read:   { MANAGER: all, SALE: own, TECH_LEAD: all, CUSTOMER_CARE: own }  # M15-09a Q88/Q96; redefined M16-05/06: own = order_lines.credited_employee_id (line-based)
  report.customer_gift.read: { MANAGER: all, SALE: all, CUSTOMER_CARE: all }  # M16-02a — matches customer_gift scope (Q97), no own split
  audit.read:            { MANAGER: all }
  # --- Hệ thống ---
  company.manage:        { MANAGER: all }   # M17-01: view + edit the single company profile, upload logo
  notification.read:     { MANAGER: self, SALE: self, TECH_LEAD: self, TECHNICIAN: self }

public_routes:
  - GET /api/v1/health
  - POST /api/v1/auth/login
  - POST /api/v1/auth/refresh
  - POST /api/v1/auth/logout
  - POST /api/v1/auth/forgot-password
  - POST /api/v1/auth/reset-password
  - GET /api/v1/auth/_e2e/last-mail

# Routes whose capability is chosen per-record, not statically (M6-01): `GET /attachments/{id}`
# picks `catalog.read`, `order.read`, `customer_gift.read` (M16-01a) or `company.manage` (M17-01) depending on the
# attachment's `owner_type` at runtime.
dynamic_routes:
  - GET /api/v1/attachments/{attachment_id}

# WebSocket routes (M7-03): `require()` only works as a FastAPI dependency on APIRoute, so a
# WebSocketRoute can't declare a capability the same way. Each path here must instead check the
# listed capability manually inside the handler (cookie auth + effective_scopes) — enforced by a
# dedicated integration test per route, not by the generic RBAC matrix.
websocket_routes:
  - path: /api/v1/notifications/ws
    capability: notification.read

# Navigation (2 levels). Frontend renders from GET /api/v1/me (roles + capabilities) + this structure,
# copied into frontend/src/app/menu.ts; a test asserts the two stay identical.
menu:
  - id: dashboard
    label: Tổng quan
    icon: LayoutDashboard
    path: /
    capability: dashboard.read
  - id: my-work
    label: Việc của tôi
    icon: ClipboardCheck
    path: /my-tasks
    capability: assignment.respond
    badge: pending_assignments_count
  - id: dispatch
    label: Điều phối kỹ thuật
    icon: Wrench
    capability: task.manage
    children:
      - { id: dispatch-queue,  label: Đơn chờ điều phối, icon: Inbox,        path: /dispatch/queue,  badge: pending_dispatch_count }
      - { id: dispatch-board,  label: Bảng đầu việc,     icon: KanbanSquare, path: /dispatch/board }
      - { id: dispatch-load,   label: Lịch & tải việc,   icon: CalendarRange, path: /dispatch/workload }
      - { id: dispatch-revise, label: Đơn cần chỉnh sửa, icon: RotateCcw,    path: /dispatch/revisions, badge: revision_count }
  - id: sales
    label: Đơn hàng
    icon: ShoppingBag
    capability: order.create
    children:
      - { id: orders,        label: Danh sách đơn, icon: ListOrdered, path: /orders }
      - { id: order-new,     label: Tạo đơn mới,   icon: FilePlus2,   path: /orders/new }
      - { id: customer-gifts, label: Ghi nhận quà tặng KH, icon: Gift, path: /customer-gifts, capability: customer_gift.read }
      - { id: customers,     label: Khách hàng,    icon: Users,       path: /customers, capability: customer.manage }
  - id: catalog
    label: Danh mục
    icon: Package
    capability: catalog.manage
    children:
      - { id: products, label: Sản phẩm, icon: Monitor,  path: /catalog/products }
      - { id: services, label: Dịch vụ,  icon: Hammer,   path: /catalog/services }
      - { id: product-service-groups, label: Nhóm sản phẩm/dịch vụ, icon: Tags, path: /catalog/groups }
  - id: employees
    label: Nhân sự & phân quyền
    icon: UserCog
    path: /employees
    capability: employee.manage
  - id: departments
    label: Phòng ban
    icon: Network
    path: /settings/departments
    capability: employee.manage
  - id: reports
    label: Báo cáo
    icon: BarChart3
    children:
      - { id: reports-kpi,              label: Báo cáo KPI,                icon: BarChart3, path: /reports/kpi,                 capability: kpi.read }
      - { id: reports-revenue-customer, label: Doanh thu theo khách hàng,  icon: Users,     path: /reports/revenue-by-customer, capability: report.revenue.read }
      - { id: reports-revenue-employee, label: Doanh thu theo nhân viên,   icon: UserCog,   path: /reports/revenue-by-employee, capability: report.revenue.read }
      - { id: reports-customer-gift,    label: Chi phí quà tặng KH,        icon: Gift,      path: /reports/customer-gifts,      capability: report.customer_gift.read }
  - id: company
    label: Thông tin công ty
    icon: Building2
    path: /settings/company
    capability: company.manage
  - id: audit
    label: Nhật ký hệ thống
    icon: History
    path: /audit
    capability: audit.read

# Mobile bottom navigation (max 5). Centre button = primary action of the user's highest-priority role;
# hidden when the user has none. Priority: TECH_LEAD > SALE > MANAGER > TECHNICIAN.
mobile_bottom_nav:
  items: [dashboard, my-work|dispatch-board|orders, primary_action, notifications, profile]
  primary_action:
    TECH_LEAD:  { label: Tạo đầu việc, icon: Plus, path: /dispatch/queue }
    SALE:       { label: Tạo đơn,      icon: Plus, path: /orders/new }
    MANAGER:    { label: Tạo đơn,      icon: Plus, path: /orders/new }
    TECHNICIAN: null
