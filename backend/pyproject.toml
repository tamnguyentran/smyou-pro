[project]
name = "smyou-backend"
version = "0.1.0"
description = "SMYou Pro API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141",  # Depends(scope="function") in app/core/db.py
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30,<2.1",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx2>=2.13",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "ruff>=0.6",
  "import-linter>=2.1",
  "mutmut>=3.0",
  "types-pyyaml>=6.0",
]

[tool.uv]
package = false

# ---------------- ruff ----------------
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "PT", "C4", "DTZ", "T20"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]  # the local alembic/ migrations folder is not a package of ours

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------- pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not docker'"
markers = [
  "ac(id): links a test to an Acceptance Criterion ID in docs/specs (e.g. AC-ORD-001)",
  "docker: needs a live Docker stack; run by make e2e (dev) and make smoke-prod (prod), not by default",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------- import-linter ----------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core is foundational: app.core must not import feature modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]

# ---------------- mutmut ----------------
[tool.mutmut]
source_paths = ["app/modules/"]
# The sandbox needs the rest of the app to import; run with SPEC_DIR=<repo>/spec (Makefile, nightly).
also_copy = ["app/__init__.py", "app/core/", "app/main.py", "app/cli.py"]
# Pure domain tests only (tests/unit/domain/): fast, no DB, no repo-relative paths.
pytest_add_cli_args_test_selection = ["tests/unit/domain/"]
# Only pure domain logic is mutated (BACKLOG M0 contract); IO layers are covered by integration tests.
do_not_mutate = ["*/router.py", "*/models.py", "*/schemas.py", "*/service.py", "*/queries.py", "*/__init__.py", "*/guards.py"]
