# Dev stack. M0-01: database only; backend/web services are added in M0-03.
name: smyou

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smyou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev}
      POSTGRES_DB: ${POSTGRES_DB:-smyou}
    ports:
      - "${DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smyou} -d $${POSTGRES_DB:-smyou}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
